<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cauvery Delta Rainfall Matrix Map</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PapaParse to read local dataset -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        
        /* Custom Floating Legend UI */
        .legend-panel {
            position: fixed;
            bottom: 30px;
            left: 20px;
            width: 260px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #e0e0e0;
        }
        .legend-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .legend-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
            flex-shrink: 0;
        }
        .legend-footer {
            font-size: 11px;
            color: #7f8c8d;
            border-top: 1px solid #eee;
            margin-top: 10px;
            padding-top: 8px;
        }

        /* Beautiful Popup Styling */
        .matrix-popup {
            font-family: Arial, sans-serif;
            font-size: 13px;
            min-width: 240px;
            line-height: 1.6;
        }
        .popup-header {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .popup-sub {
            color: #7f8c8d;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
        }
        .popup-table tr.total-row {
            background: #f0f4f8;
            font-weight: bold;
            border-top: 1px solid #d0d7de;
            border-bottom: 1px solid #d0d7de;
        }
        .popup-table td {
            padding: 4px 6px;
        }
        .popup-table td.val {
            text-align: right;
        }
        .popup-coords {
            margin-top: 8px;
            font-size: 10px;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Leaflet Map viewport -->
    <div id="map"></div>

    <!-- Floating Legend Viewport Panel matching image_f22c21.jpg -->
   <div class="legend-panel">
        <div class="legend-title" id="legend-date-title">Annual Rainfall — Jan to Jun 17, 2026</div>
        <div class="legend-row"><span class="color-dot" style="background:#888888;"></span>&lt; 50 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#2ecc71;"></span>50 – 100 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#3498db;"></span>100 – 200 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#f1c40f;"></span>200 – 300 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#e67e22;"></span>300 – 500 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#e74c3c;"></span>&gt; 500 mm</div>
        <div class="legend-footer">
            Circle size: <b>small</b> = individual gauge station<br>
            Colors match compiled total accumulations.
        </div>
    </div>

    <script>
        // 1. Initialize map view frame over Delta coordinate center
        const map = L.map('map', {
            center: [10.80, 79.35],
            zoom: 9.5,
            zoomControl: true
        });

        // 2. Load the clean grayscale minimalist tile base map layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 3. Request data timeline array parsing
        const DATA_SOURCE = 'thanjavur_stations_rainfall_2026.csv';

        Papa.parse(DATA_SOURCE, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                renderWeatherMatrix(results.data);
            }
        });
// function of renderWeather Data Starts
       function renderWeatherMatrix(data) {
            const latestDate = data[data.length - 1].Date;
            document.getElementById('legend-date-title').innerText = `Annual Rainfall — Jan to ${latestDate}, 2026`;

            // Phase 1: Aggregate by Station
            const stationMap = {};

            data.forEach(row => {
                const name = row.Station_Name;
                const loc = row.Location_Details || "Unknown";
                if (!name) return;

                const uniqueID = name + "_" + loc;

                if (!stationMap[uniqueID]) {
                    stationMap[uniqueID] = {
                        name: name,
                        lat: parseFloat(row.Latitude),
                        lon: parseFloat(row.Longitude),
                        hierarchy: loc,
                        district: getDistrictName(loc),
                        annualTotal: 0.0,
                        winterTotal: 0.0,
                        summerTotal: 0.0,
                        swmTotal: 0.0,
                        todayVal: 0.0,
                        // IMD 6-Tier Classifications
                        highestRain: 0.0,
                        highestDate: "-",
                        veryLightDays: 0,  // 0.1 to 2.4 mm
                        lightDays: 0,      // 2.5 to 15.5 mm
                        moderateDays: 0,   // 15.6 to 64.4 mm
                        heavyDays: 0,      // 64.5 to 115.5 mm
                        veryHeavyDays: 0,  // 115.6 to 204.4 mm
                        extremeDays: 0     // >= 204.5 mm
                    };
                }

                let mm = parseFloat(row.Rainfall_mm);
                if (isNaN(mm)) mm = 0.0;

                const st = stationMap[uniqueID];
                st.annualTotal += mm;

                // Track Highest Single Day Rainfall
                if (mm > st.highestRain) {
                    st.highestRain = mm;
                    st.highestDate = row.Date;
                }

                // Count Corrected IMD Classifications
                if (mm > 0) {
                    if (mm <= 2.4) st.veryLightDays++;
                    else if (mm <= 15.5) st.lightDays++;
                    else if (mm <= 64.4) st.moderateDays++;
                    else if (mm <= 115.5) st.heavyDays++;
                    else if (mm <= 204.4) st.veryHeavyDays++;
                    else st.extremeDays++;
                }

                const dateParts = row.Date.split('-');
                if (dateParts.length === 3) {
                    const month = dateParts[1]; 
                    if (month === "01" || month === "02") st.winterTotal += mm;
                    else if (month === "03" || month === "04" || month === "05") st.summerTotal += mm;
                    else if (month === "06") st.swmTotal += mm;
                }

                if (row.Date === latestDate) st.todayVal = mm;
            });

            // Phase 2: Build Taluk and District Aggregations
            const talukMap = {};
            const districtMap = {};

            Object.values(stationMap).forEach(st => {
                if (isNaN(st.lat) || isNaN(st.lon)) return;

                if (!talukMap[st.hierarchy]) {
                    talukMap[st.hierarchy] = { name: st.hierarchy, sub: "Taluk/Region", count: 0, latSum: 0, lonSum: 0, annual: 0, winter: 0, summer: 0, swm: 0, today: 0 };
                }
                let t = talukMap[st.hierarchy];
                t.count++; t.latSum += st.lat; t.lonSum += st.lon; t.annual += st.annualTotal; t.winter += st.winterTotal; t.summer += st.summerTotal; t.swm += st.swmTotal; t.today += st.todayVal;

                if (!districtMap[st.district]) {
                    districtMap[st.district] = { name: st.district, sub: "District Level Average", count: 0, latSum: 0, lonSum: 0, annual: 0, winter: 0, summer: 0, swm: 0, today: 0 };
                }
                let d = districtMap[st.district];
                d.count++; d.latSum += st.lat; d.lonSum += st.lon; d.annual += st.annualTotal; d.winter += st.winterTotal; d.summer += st.summerTotal; d.swm += st.swmTotal; d.today += st.todayVal;
            });

            // Phase 3: Function to draw circles
            function drawLayer(mapData, targetLayer, radiusSize, isAverage) {
                for (let key in mapData) {
                    const item = mapData[key];
                    if (isAverage && item.count === 0) continue;

                    const divider = isAverage ? item.count : 1;
                    const lat = isAverage ? item.latSum / divider : item.lat;
                    const lon = isAverage ? item.lonSum / divider : item.lon;
                    
                    const annual = isAverage ? item.annual / divider : item.annualTotal;
                    const winter = isAverage ? item.winter / divider : item.winterTotal;
                    const summer = isAverage ? item.summer / divider : item.summerTotal;
                    const swm = isAverage ? item.swm / divider : item.swmTotal;
                    const today = isAverage ? item.today / divider : item.todayVal;

                    const markerColor = getColor(annual);

                    const circle = L.circleMarker([lat, lon], {
                        radius: radiusSize,
                        fillColor: markerColor,
                        color: "white",
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.85
                    }).addTo(targetLayer);

                    const titlePrefix = isAverage ? `Average across ${item.count} stations` : "Total Accumulation";
                    
                    // Build the advanced popup HTML with the 6-tier system
                    let advancedMetricsHTML = "";
                    
                    if (!isAverage) {
                        advancedMetricsHTML = `
                            <tr style="border-top: 2px solid #bdc3c7;">
                                <td colspan="2" style="padding-top:8px; padding-bottom:2px; font-size:11px; color:#7f8c8d; text-transform:uppercase;">🏆 Annual Extreme</td>
                            </tr>
                            <tr><td>Highest Single Day</td><td class="val" style="color:#c0392b;"><b>${item.highestRain.toFixed(1)} mm</b></td></tr>
                            <tr><td>Date of Extreme</td><td class="val">${item.highestDate}</td></tr>
                            
                            <tr>
                                <td colspan="2" style="padding-top:8px; padding-bottom:2px; font-size:11px; color:#7f8c8d; text-transform:uppercase;">📊 IMD Rain Days</td>
                            </tr>
                            <tr><td>V. Light <i>(< 2.5)</i></td><td class="val">${item.veryLightDays} days</td></tr>
                            <tr><td>Light <i>(2.5 - 15.5)</i></td><td class="val">${item.lightDays} days</td></tr>
                            <tr><td>Moderate <i>(15.6 - 64.4)</i></td><td class="val">${item.moderateDays} days</td></tr>
                            <tr><td>Heavy <i>(64.5 - 115.5)</i></td><td class="val">${item.heavyDays} days</td></tr>
                            <tr><td>V. Heavy <i>(115.6 - 204.4)</i></td><td class="val">${item.veryHeavyDays} days</td></tr>
                            <tr><td>Ext. Heavy <i>(> 204.4)</i></td><td class="val">${item.extremeDays} days</td></tr>
                        `;
                    }

                    const popupContent = `
                        <div class="matrix-popup">
                            <div class="popup-header">${item.name}</div>
                            <div class="popup-sub">${isAverage ? item.sub : item.hierarchy}</div>
                            <table class="popup-table">
                                <tr><td>🌧️ Today (${latestDate})</td><td class="val"><b>${today.toFixed(1)} mm</b></td></tr>
                                <tr class="total-row"><td>Annual ${isAverage ? 'Average' : 'Total'}</td><td class="val">${annual.toFixed(1)} mm</td></tr>
                                <tr><td>❄️ Winter</td><td class="val">${winter.toFixed(1)} mm</td></tr>
                                <tr><td>☀️ Summer</td><td class="val">${summer.toFixed(1)} mm</td></tr>
                                <tr><td>☁️ SWM (so far)</td><td class="val">${swm.toFixed(1)} mm</td></tr>
                                ${advancedMetricsHTML}
                            </table>
                            <div class="popup-coords">${titlePrefix}</div>
                        </div>
                    `;
                    circle.bindPopup(popupContent, { maxWidth: 300 });
                    circle.bindTooltip(`<b>${item.name}</b><br>${isAverage ? 'Avg' : 'Total'}: ${annual.toFixed(1)} mm`, { sticky: true });
                }
            }

            drawLayer(stationMap, layers.station, 7, false); 
            drawLayer(talukMap, layers.taluk, 14, true);     
            drawLayer(districtMap, layers.district, 22, true); 
        }
        //Function of rwender weather data ends
    </script>
</body>
</html>
