<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cauvery Delta Rainfall Tracker</title>
    
    <!-- Leaflet for Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* NORMAL, SCROLLABLE WEBPAGE */
        html, body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #2c3e50;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TOP SECTION: SIDEBAR + MAP */
        .top-workspace {
            display: flex;
            flex-direction: row;
            height: 75vh; /* Takes up 75% of screen height */
            min-height: 550px; /* Safe minimum height so it never disappears */
            border-bottom: 2px solid #bdc3c7;
        }

        /* LEFT SIDEBAR */
        .sidebar {
            width: 320px;
            background: white;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #dcdde1;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .sidebar h2 { margin-top: 0; font-size: 18px; font-weight: 800; margin-bottom: 25px; }
        .control-group { margin-bottom: 25px; }
        .control-label { display: block; font-size: 11px; font-weight: bold; color: #7f8c8d; text-transform: uppercase; margin-bottom: 8px; }
        
        select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #bdc3c7; font-weight: bold; font-size: 14px; }
        
        .toggle-box { background: #f8f9fa; border: 1px solid #dcdde1; padding: 10px; border-radius: 6px; }
        .toggle-box label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .toggle-box label:last-child { margin-bottom: 0; }
        .toggle-box input { margin-right: 8px; }

        .slider-text { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        #sliderDateDisplay { color: #16a085; }
        input[type=range] { width: 100%; cursor: pointer; }

        .color-bar { height: 10px; border-radius: 4px; margin-top: 5px; background: linear-gradient(to right, #c62828, #f4511e, #ffca28, #64dd17, #0288d1, #283593, #6a1b9a); border: 1px solid #333; }
        .color-labels { display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; margin-top: 4px; }

        /* RIGHT MAP */
        #map {
            flex-grow: 1;
            height: 100%;
            background-color: #e5e9ec;
            z-index: 1;
        }

        /* BOTTOM SECTION: TABLE */
        .bottom-workspace {
            padding: 25px;
            background: white;
            flex-grow: 1;
        }

        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-header h3 { margin: 0; font-size: 18px; }
        #tableFilter { padding: 6px 12px; font-size: 14px; font-weight: bold; border: 1px solid #bdc3c7; border-radius: 4px; }

        .dash-table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
        .dash-table th { background: #ecf0f1; color: #7f8c8d; font-weight: bold; padding: 12px; border-bottom: 2px solid #bdc3c7; text-transform: uppercase; font-size: 12px; }
        .dash-table td { padding: 12px; border-bottom: 1px solid #f1f2f6; font-weight: 500; }
        .dash-table tr:hover { background-color: #f1f4f8; }
        .val-highlight { font-weight: 800; color: #2980b9; }

        /* POPUPS */
        .matrix-popup { min-width: 250px; }
        .popup-header { font-size: 16px; font-weight: bold; margin-bottom: 2px; }
        .popup-sub { color: #7f8c8d; font-size: 12px; margin-bottom: 8px; }
        .stats-table-exact { width: 100%; font-size: 12px; border-collapse: collapse; margin-bottom: 5px; }
        .stats-table-exact td { padding: 4px; border-bottom: 1px solid #f1f2f6; }
        .stats-table-exact td:last-child { text-align: right; font-weight: bold; }
        .chart-container { height: 140px; margin-top: 5px; }

        @media (max-width: 768px) {
            .top-workspace { flex-direction: column; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #dcdde1; }
            #map { min-height: 400px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- SIDEBAR & MAP -->
        <div class="top-workspace">
            <div class="sidebar">
                <h2>Delta Weather Monitor</h2>
                
                <div class="control-group">
                    <span class="control-label">Year</span>
                    <select id="yearSelect"></select>
                </div>

                <div class="control-group">
                    <span class="control-label">Accumulate Up To</span>
                    <div class="slider-text">
                        <span>Jan 1</span>
                        <span id="sliderDateDisplay">...</span>
                    </div>
                    <input type="range" id="timeSlider" min="1" max="365" value="365">
                </div>

                <div class="control-group">
                    <span class="control-label">View Settings</span>
                    <div class="toggle-box">
                        <label><input type="radio" name="mapView" value="station" checked> 📍 Station Markers</label>
                        <label><input type="radio" name="mapView" value="district"> 🟢 District Averages</label>
                        <hr style="border: 0; border-top: 1px solid #dcdde1; margin: 10px 0;">
                        <label><input type="radio" name="popupView" value="stats" checked> 📝 Exact Stats Popup</label>
                        <label><input type="radio" name="popupView" value="chart"> 📊 Monthly Chart Popup</label>
                    </div>
                </div>

                <div class="control-group">
                    <span class="control-label">Rainfall Scale (mm)</span>
                    <div class="color-bar"></div>
                    <div class="color-labels"><span>0</span><span>500</span><span>1000</span><span>1500</span><span>2000+</span></div>
                </div>
            </div>

            <div id="map"></div>
        </div>

        <!-- TABLE SECTION -->
        <div class="bottom-workspace">
            <div class="table-header">
                <h3>Station & District Data</h3>
                <select id="tableFilter">
                    <option value="districts">🟢 Show All Districts</option>
                    <option value="stations">📍 Show All Stations</option>
                    <optgroup label="Stations by District" id="districtOptGroup"></optgroup>
                </select>
            </div>
            
            <table class="dash-table" id="dataTable">
                <!-- Javascript will inject rows here -->
            </table>
        </div>

    </div>

    <script>
        const map = L.map('map', { center: [10.80, 79.35], zoom: 9 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);

        const layers = { station: L.layerGroup().addTo(map), district: L.layerGroup() };
        let chartInstances = {};

        let rainData = [];
        let stationMeta = {}; 
        let currentStations = {};
        let currentDistricts = {};

        // Safe String Cleaners
        function cleanStr(str) { return str ? str.replace(/\u00A0/g, " ").trim().toLowerCase() : ""; }
        function normDist(str) { return cleanStr(str).replace('thirunelveli', 'tirunelveli').replace('thanjavoor', 'thanjavur'); }

        // Color Scale
        function getColor(val) {
            if (val < 100) return "#c62828"; if (val < 200) return "#e53935"; if (val < 300) return "#f4511e"; 
            if (val < 400) return "#fb8c00"; if (val < 500) return "#ffca28"; if (val < 600) return "#ffd54f";
            if (val < 800) return "#64dd17"; if (val < 1000) return "#00c853"; if (val < 1200) return "#0288d1"; 
            if (val < 1400) return "#1565c0"; if (val < 1600) return "#283593"; return "#4527a0"; 
        }

        // Date Math
        function getDOY(dateStr) {
            const parts = dateStr.split('-'); if(parts.length !== 3) return null;
            const d = parseInt(parts[0]), m = parseInt(parts[1]), y = parseInt(parts[2]);
            const date = new Date(y, m - 1, d), start = new Date(y, 0, 0);
            return { year: y, month: m, doy: Math.floor((date - start) / 86400000) };
        }
        function formatDOY(doy, year) {
            return new Date(year, 0, doy).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // LOAD DATA
        Papa.parse('thanjavur_stations_rainfall_2026.csv', {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                rainData = res.data;
                Papa.parse('Stations.csv', {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(stRes) { buildMeta(stRes.data); init(); }
                });
            }
        });

        // BULLETPROOF PAPANASAM FIX
        function buildMeta(data) {
            stationMeta = {};
            data.forEach(row => {
                const sName = cleanStr(row['Name of the station'] || row.Station_Name);
                const dName = normDist(row.District || row.district);
                if(!sName) return;

                const lat = parseFloat(row.Latitude), lon = parseFloat(row.Longitude);
                
                // 1. Save Exact Match (District_Station)
                stationMeta[`${dName}_${sName}`] = { lat, lon, district: dName };
                
                // 2. Save Generic Match (Just Station) - ONLY if it's not a known duplicate
                if(!stationMeta[sName]) {
                    stationMeta[sName] = { lat, lon, district: dName };
                } else if (stationMeta[sName].district !== dName) {
                    stationMeta[sName] = 'DUPLICATE'; // Force engine to use exact match
                }
            });
        }

        function init() {
            const years = new Set();
            let maxDOY = 1;
            rainData.forEach(r => {
                const d = getDOY(r.Date);
                if(d) { years.add(d.year); if(d.doy > maxDOY) maxDOY = d.doy; }
            });

            const ySelect = document.getElementById('yearSelect');
            Array.from(years).sort((a,b)=>b-a).forEach(y => ySelect.add(new Option(y,y)));

            const slider = document.getElementById('timeSlider');
            slider.max = maxDOY; slider.value = maxDOY;

            // Events
            ySelect.addEventListener('change', calculateData);
            slider.addEventListener('input', calculateData);
            document.getElementById('tableFilter').addEventListener('change', renderTable);
            
            document.querySelectorAll('input[name="mapView"], input[name="popupView"]').forEach(r => {
                r.addEventListener('change', () => { drawMap(); renderTable(); });
            });

            calculateData();
        }

        function calculateData() {
            const year = parseInt(document.getElementById('yearSelect').value);
            const limitDOY = parseInt(document.getElementById('timeSlider').value);
            document.getElementById('sliderDateDisplay').innerText = formatDOY(limitDOY, year);

            currentStations = {};
            currentDistricts = {};
            const activeDistricts = new Set();

            rainData.forEach(row => {
                const d = getDOY(row.Date);
                if(!d || d.year !== year || d.doy > limitDOY) return;

                const rawS = row.Station_Name || row['Name of the station'] || "";
                const rawD = row.District || row.district || "Unknown";
                const cS = cleanStr(rawS);
                const cD = normDist(rawD);
                if(!cS) return;

                // Match Metadata safely
                let meta = stationMeta[`${cD}_${cS}`];
                if(!meta && stationMeta[cS] && stationMeta[cS] !== 'DUPLICATE') meta = stationMeta[cS];
                meta = meta || { lat: NaN, lon: NaN, district: rawD };

                const stId = `${normDist(meta.district)}_${cS}`;
                
                if(!currentStations[stId]) {
                    currentStations[stId] = { 
                        name: rawS, dist: meta.district, lat: meta.lat, lon: meta.lon, 
                        tot: 0, win: 0, sum: 0, swm: 0, nem: 0, monthly: new Array(12).fill(0)
                    };
                }

                const mm = parseFloat(row.Rainfall_mm) || 0;
                const st = currentStations[stId];
                
                st.tot += mm;
                st.monthly[d.month-1] += mm;
                if(d.month <= 2) st.win += mm; else if(d.month <= 5) st.sum += mm;
                else if(d.month <= 9) st.swm += mm; else st.nem += mm;
            });

            // Aggregate Districts
            Object.values(currentStations).forEach(st => {
                if(!st.dist || st.dist === "Unknown") return;
                activeDistricts.add(st.dist);
                
                if(!currentDistricts[st.dist]) {
                    currentDistricts[st.dist] = { name: st.dist, count: 0, valid: 0, lat: 0, lon: 0, tot: 0, win:0, sum:0, swm:0, nem:0, monthly: new Array(12).fill(0) };
                }
                let dist = currentDistricts[st.dist];
                dist.count++; dist.tot += st.tot; dist.win += st.win; dist.sum += st.sum; dist.swm += st.swm; dist.nem += st.nem;
                if(!isNaN(st.lat)) { dist.valid++; dist.lat += st.lat; dist.lon += st.lon; }
                for(let i=0; i<12; i++) dist.monthly[i] += st.monthly[i];
            });

            // Update Dropdown
            const dGroup = document.getElementById('districtOptGroup');
            dGroup.innerHTML = '';
            Array.from(activeDistricts).sort().forEach(d => {
                dGroup.appendChild(new Option(d, d));
            });

            drawMap();
            renderTable();
        }

        function drawMap() {
            layers.station.clearLayers(); layers.district.clearLayers();
            const vMode = document.querySelector('input[name="mapView"]:checked').value;
            const pMode = document.querySelector('input[name="popupView"]:checked').value;
            
            const data = vMode === 'station' ? Object.values(currentStations) : Object.values(currentDistricts);
            const targetLayer = layers[vMode];

            data.forEach((item, index) => {
                const isDist = vMode === 'district';
                if(isDist && item.valid === 0) return;
                if(!isDist && isNaN(item.lat)) return;

                const div = isDist ? item.count : 1;
                const lat = isDist ? item.lat/item.valid : item.lat;
                const lon = isDist ? item.lon/item.valid : item.lon;
                const tot = item.tot/div, swm = item.swm/div, nem = item.nem/div;
                
                const marker = L.circleMarker([lat, lon], {
                    radius: isDist ? 18 : 6, fillColor: getColor(tot), color: "white", weight: 1.5, fillOpacity: 0.9
                }).addTo(targetLayer);

                const cId = `chart_${index}`;
                let popHTML = `<div class="matrix-popup"><div class="popup-header">${item.name}</div><div class="popup-sub">${isDist ? 'District Average' : item.dist}</div>`;
                
                if(pMode === 'stats') {
                    popHTML += `<table class="stats-table-exact"><tr><td>Total</td><td>${tot.toFixed(1)} mm</td></tr><tr><td>SWM</td><td>${swm.toFixed(1)} mm</td></tr><tr><td>NEM</td><td>${nem.toFixed(1)} mm</td></tr></table></div>`;
                } else {
                    popHTML += `<div class="chart-container"><canvas id="${cId}"></canvas></div></div>`;
                }

                marker.bindPopup(popHTML);
                marker.bindTooltip(`<b>${item.name}</b><br>${tot.toFixed(1)} mm`);

                if(pMode === 'chart') {
                    marker.on('popupopen', () => {
                        if(chartInstances[cId]) chartInstances[cId].destroy();
                        chartInstances[cId] = new Chart(document.getElementById(cId), {
                            type: 'bar', data: { labels: ['J','F','M','A','M','J','J','A','S','O','N','D'], datasets: [{ data: item.monthly.map(m=>m/div), backgroundColor: '#3498db' }] },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x:{display:false} } }
                        });
                    });
                }
            });
        }

        function renderTable() {
            const filter = document.getElementById('tableFilter').value;
            const tBody = document.getElementById('dataTable');
            
            let html = `<tr><th>${filter==='districts'?'District':'Station'}</th><th>${filter==='districts'?'Stations':'District'}</th><th>Total (mm)</th><th>Winter</th><th>Summer</th><th>SWM</th><th>NEM</th></tr>`;

            if(filter === 'districts') {
                Object.values(currentDistricts).sort((a,b)=> (b.tot/b.count) - (a.tot/a.count)).forEach(d => {
                    html += `<tr><td style="font-weight:bold;">${d.name}</td><td>${d.count}</td><td class="val-highlight">${(d.tot/d.count).toFixed(1)}</td><td>${(d.win/d.count).toFixed(1)}</td><td>${(d.sum/d.count).toFixed(1)}</td><td>${(d.swm/d.count).toFixed(1)}</td><td>${(d.nem/d.count).toFixed(1)}</td></tr>`;
                });
            } else {
                let arr = Object.values(currentStations);
                if(filter !== 'stations') arr = arr.filter(s => s.dist === filter);
                
                if(arr.length === 0) html += `<tr><td colspan="7">No data found.</td></tr>`;
                arr.sort((a,b) => b.tot - a.tot).forEach(s => {
                    html += `<tr><td style="font-weight:bold;">${s.name}</td><td>${s.dist}</td><td class="val-highlight">${s.tot.toFixed(1)}</td><td>${s.win.toFixed(1)}</td><td>${s.sum.toFixed(1)}</td><td>${s.swm.toFixed(1)}</td><td>${s.nem.toFixed(1)}</td></tr>`;
                });
            }
            tBody.innerHTML = html;
        }
    </script>
</body>
</html>
