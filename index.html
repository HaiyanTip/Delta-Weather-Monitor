<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cauvery Delta Rainfall Matrix Map</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- PapaParse to read local dataset -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        
        /* Custom Floating Legend UI */
        .legend-panel {
            position: fixed;
            bottom: 30px;
            left: 20px;
            width: 260px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #e0e0e0;
        }
        .legend-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .legend-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            display: inline-block;
            flex-shrink: 0;
        }
        .legend-footer {
            font-size: 11px;
            color: #7f8c8d;
            border-top: 1px solid #eee;
            margin-top: 10px;
            padding-top: 8px;
        }

        /* Beautiful Popup Styling */
        .matrix-popup {
            font-family: Arial, sans-serif;
            font-size: 13px;
            min-width: 240px;
            line-height: 1.6;
        }
        .popup-header {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .popup-sub {
            color: #7f8c8d;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
        }
        .popup-table tr.total-row {
            background: #f0f4f8;
            font-weight: bold;
            border-top: 1px solid #d0d7de;
            border-bottom: 1px solid #d0d7de;
        }
        .popup-table td {
            padding: 4px 6px;
        }
        .popup-table td.val {
            text-align: right;
        }
        .popup-coords {
            margin-top: 8px;
            font-size: 10px;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Leaflet Map viewport -->
    <div id="map"></div>

    <!-- Floating Legend Viewport Panel matching image_f22c21.jpg -->
   <div class="legend-panel">
        <div class="legend-title" id="legend-date-title">Annual Rainfall — Jan to Jun 17, 2026</div>
        <div class="legend-row"><span class="color-dot" style="background:#888888;"></span>&lt; 50 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#2ecc71;"></span>50 – 100 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#3498db;"></span>100 – 200 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#f1c40f;"></span>200 – 300 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#e67e22;"></span>300 – 500 mm</div>
        <div class="legend-row"><span class="color-dot" style="background:#e74c3c;"></span>&gt; 500 mm</div>
        <div class="legend-footer">
            Circle size: <b>small</b> = individual gauge station<br>
            Colors match compiled total accumulations.
        </div>
    </div>

    <script>
        // 1. Initialize map view frame over Delta coordinate center
        const map = L.map('map', {
            center: [10.80, 79.35],
            zoom: 9.5,
            zoomControl: true
        });

        // 2. Load the clean grayscale minimalist tile base map layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // 3. Request data timeline array parsing
        const DATA_SOURCE = 'thanjavur_stations_rainfall_2026.csv';

        Papa.parse(DATA_SOURCE, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                renderWeatherMatrix(results.data);
            }
        });

        function renderWeatherMatrix(data) {
            const latestDate = data[data.length - 1].Date;
            document.getElementById('legend-date-title').innerText = `Annual Rainfall — Jan to ${latestDate}, 2026`;
             const matrixMap = {};

            data.forEach(row => {
                const name = row.Station_Name;
                const locationDetails = row.Location_Details || "Unknown";
                
                if (!name) return;

                // THE FIX: Create a Unique ID combining Name and Location to separate duplicates
                const uniqueID = name + "_" + locationDetails;

                // Initialize station metrics dictionary using the uniqueID
                if (!matrixMap[uniqueID]) {
                    matrixMap[uniqueID] = {
                        name: name, // We still keep the clean name for the popup!
                        lat: parseFloat(row.Latitude),
                        lon: parseFloat(row.Longitude),
                        hierarchy: locationDetails,
                        annualTotal: 0.0,
                        winterTotal: 0.0,
                        summerTotal: 0.0,
                        swmTotal: 0.0,
                        todayVal: 0.0
                    };
                }

                let mm = parseFloat(row.Rainfall_mm);
                if (isNaN(mm)) mm = 0.0;

                const station = matrixMap[uniqueID];
                station.annualTotal += mm;

                // Parse standard date text index flags (DD-MM-YYYY) to isolate seasonal clusters
                const dateParts = row.Date.split('-');
                if (dateParts.length === 3) {
                    const month = dateParts[1]; 
                    if (month === "01" || month === "02") station.winterTotal += mm;
                    else if (month === "03" || month === "04" || month === "05") station.summerTotal += mm;
                    else if (month === "06") station.swmTotal += mm;
                }

                // If processing the active maximum date index row
                if (row.Date === latestDate) {
                    station.todayVal = mm;
                }
            }); 
            /*const matrixMap = {};

            data.forEach(row => {
                const name = row.Station_Name;
                if (!name) return;

                // Initialize station metrics dictionary structural grouping
                if (!matrixMap[name]) {
                    matrixMap[name] = {
                        name: name,
                        lat: parseFloat(row.Latitude),
                        lon: parseFloat(row.Longitude),
                        hierarchy: row.Location_Details || "Cauvery Delta Region",
                        annualTotal: 0.0,
                        winterTotal: 0.0,
                        summerTotal: 0.0,
                        swmTotal: 0.0,
                        todayVal: 0.0
                    };
                }

                let mm = parseFloat(row.Rainfall_mm);
                if (isNaN(mm)) mm = 0.0;

                const station = matrixMap[name];
                station.annualTotal += mm;

                // Parse standard date text index flags (DD-MM-YYYY) to isolate seasonal clusters
                const dateParts = row.Date.split('-');
                if (dateParts.length === 3) {
                    const month = dateParts[1]; 
                    if (month === "01" || month === "02") station.winterTotal += mm;
                    else if (month === "03" || month === "04" || month === "05") station.summerTotal += mm;
                    else if (month === "06") station.swmTotal += mm;
                }

                // If processing the active maximum date index row
                if (row.Date === latestDate) {
                    station.todayVal = mm;
                }
            });*/

            // 4. Trace calculated stations mapping arrays onto spatial field
            for (let id in matrixMap) {
                const st = matrixMap[id];
                if (isNaN(st.lat) || !st.lat) continue;

                // Match specific HEX color codes based on cumulative scale index tiering
                // Match specific HEX color codes based on new cumulative scale tiers
                let markerColor = "#888888"; // default for < 50 mm
                if (st.annualTotal >= 50 && st.annualTotal < 100) markerColor = "#27ae60";
                else if (st.annualTotal >= 100 && st.annualTotal < 200) markerColor = "#2980b9";
                else if (st.annualTotal >= 200 && st.annualTotal < 300) markerColor = "#e67e22";
                else if (st.annualTotal >= 300 && st.annualTotal < 500) markerColor = "#c0392b";
                else if (st.annualTotal >= 500) markerColor = "#8e44ad";

               /* let markerColor = "#888888";
                if (st.annualTotal >= 50 && st.annualTotal < 150) markerColor = "#27ae60";
                else if (st.annualTotal >= 150 && st.annualTotal < 300) markerColor = "#2980b9";
                else if (st.annualTotal >= 300 && st.annualTotal < 500) markerColor = "#e67e22";
                else if (st.annualTotal >= 500 && st.annualTotal < 800) markerColor = "#c0392b";
                else if (st.annualTotal >= 800) markerColor = "#8e44ad"; */

                const circle = L.circleMarker([st.lat, st.lon], {
                    radius: 7,
                    fillColor: markerColor,
                    color: "white",
                    weight: 1.5,
                    opacity: 1,
                    fillOpacity: 0.85
                }).addTo(map);

                // Elegant layout matching the target popup interface text alignments
                const popupContent = `
                    <div class="matrix-popup">
                        <div class="popup-header">${st.name}</div>
                        <div class="popup-sub">${st.hierarchy}</div>
                        <table class="popup-table">
                            <tr><td>🌧️ Today's Rainfall</td><td class="val"><b>${st.todayVal.toFixed(1)} mm</b></td></tr>
                            <tr class="total-row"><td>Annual total (Jan–${latestDate.split('-')[1] === '06' ? 'Jun' : 'Date'} ${parseInt(latestDate.split('-')[0])})</td><td class="val">${st.annualTotal.toFixed(1)} mm</td></tr>
                            <tr><td>❄️ Winter (Jan–Feb)</td><td class="val">${st.winterTotal.toFixed(1)} mm</td></tr>
                            <tr><td>☀️ Summer (Mar–May)</td><td class="val">${st.summerTotal.toFixed(1)} mm</td></tr>
                            <tr><td>☁️ SWM Jun (so far)</td><td class="val">${st.swmTotal.toFixed(1)} mm</td></tr>
                        </table>
                        <div class="popup-coords">Location: ${st.lat.toFixed(4)}°N, ${st.lon.toFixed(4)}°E</div>
                    </div>
                `;

                circle.bindPopup(popupContent, { maxWidth: 290 });
                
                // Light text hover tag matching interface tracking styles
                circle.bindTooltip(`<b>${st.name}</b><br>Total: ${st.annualTotal.toFixed(1)} mm`, { sticky: true });
            }
        }
    </script>
</body>
</html>
