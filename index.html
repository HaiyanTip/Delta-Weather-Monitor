<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cauvery Delta Rainfall Matrix Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        
        /* Custom Floating Legend UI */
        .legend-panel {
            position: fixed;
            bottom: 30px;
            left: 20px;
            width: 280px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 1000;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid #e0e0e0;
        }
        .legend-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        /* View Toggle Switches */
        .view-toggles {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .view-toggles label {
            cursor: pointer;
            font-weight: 500;
            color: #34495e;
            display: flex;
            align-items: center;
        }
        .view-toggles input {
            margin-right: 8px;
            cursor: pointer;
        }

        /* Custom Red-to-Purple Color Bar Gradient */
        .color-scale-bar {
            height: 12px;
            width: 100%;
            background: linear-gradient(to right, #c62828, #f4511e, #ffca28, #64dd17, #0288d1, #283593, #6a1b9a);
            border-radius: 4px;
            margin-top: 10px;
            margin-bottom: 6px;
            border: 1px solid #2c3e50;
        }
        .color-scale-labels {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #7f8c8d;
            font-weight: bold;
        }

        .legend-footer {
            font-size: 11px;
            color: #7f8c8d;
            border-top: 1px solid #eee;
            margin-top: 12px;
            padding-top: 8px;
        }

        /* Beautiful Popup Styling */
        .matrix-popup {
            font-family: Arial, sans-serif;
            font-size: 13px;
            min-width: 240px;
            line-height: 1.6;
        }
        .popup-header {
            font-size: 15px;
            font-weight: bold;
            color: #2c3e50;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .popup-sub {
            color: #7f8c8d;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .popup-table {
            width: 100%;
            border-collapse: collapse;
        }
        .popup-table tr.total-row {
            background: #f0f4f8;
            font-weight: bold;
            border-top: 1px solid #d0d7de;
            border-bottom: 1px solid #d0d7de;
        }
        .popup-table td {
            padding: 4px 6px;
        }
        .popup-table td.val {
            text-align: right;
        }
        .popup-coords {
            margin-top: 8px;
            font-size: 10px;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* NEW: Mobile-Adaptive Legend Styles */
        @media (max-width: 600px) {
            .legend-panel {
                width: 75%;
                left: 50%;
                transform: translateX(-50%);
                bottom: 15px;
                padding: 10px;
                font-size: 11px;
                max-height: 35vh;
                overflow-y: auto;
            }
            .legend-title { font-size: 12px; margin-bottom: 6px; }
            .view-toggles label { font-size: 11px; margin-bottom: 4px; }
            .color-scale-bar { height: 8px; margin-top: 8px; margin-bottom: 4px; }
            .color-scale-labels { font-size: 9px; }
            .legend-footer { font-size: 10px; margin-top: 8px; padding-top: 6px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="legend-panel">
        <div class="legend-title" id="legend-date-title">Annual Rainfall — 2026</div>
        
        <div class="view-toggles">
            <label><input type="radio" name="viewMode" value="station" checked> 📍 Individual Stations</label>
            <label><input type="radio" name="viewMode" value="taluk"> ⭕ Taluk/Region Averages</label>
            <label><input type="radio" name="viewMode" value="district"> 🟢 District Averages</label>
        </div>

        <div class="color-scale-bar"></div>
        <div class="color-scale-labels">
            <span>0</span>
            <span>500</span>
            <span>1000</span>
            <span>1500</span>
            <span>2000+</span>
        </div>

        <div class="legend-footer">
            Colors match total accumulations.<br>Regional views show the <b>Average</b> of all stations.
        </div>
    </div>

    <script>
        // Initialize Map
        const map = L.map('map', {
            center: [10.80, 79.35],
            zoom: 9.5,
            zoomControl: true
        });

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Layer Groups for toggling
        const layers = {
            station: L.layerGroup().addTo(map),
            taluk: L.layerGroup(),
            district: L.layerGroup()
        };

        // UI Event Listener to switch layers
        document.querySelectorAll('input[name="viewMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                map.removeLayer(layers.station);
                map.removeLayer(layers.taluk);
                map.removeLayer(layers.district);
                map.addLayer(layers[e.target.value]);
            });
        });

        const DATA_SOURCE = 'thanjavur_stations_rainfall_2026.csv';

        Papa.parse(DATA_SOURCE, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                try {
                    renderWeatherMatrix(results.data);
                } catch (error) {
                    console.error("Map rendering failed: ", error);
                }
            }
        });

        // Custom Extended Color Range
        function getColor(value) {
            if (value < 100) return "#c62828"; 
            if (value < 200) return "#e53935";
            if (value < 300) return "#f4511e";
            if (value < 400) return "#fb8c00";
            if (value < 500) return "#ffca28"; 
            if (value < 600) return "#ffd54f";
            if (value < 800) return "#64dd17"; 
            if (value < 1000) return "#00c853";
            if (value < 1200) return "#0288d1"; 
            if (value < 1400) return "#1565c0"; 
            if (value < 1600) return "#283593";
            if (value < 1800) return "#4527a0"; 
            if (value < 2000) return "#6a1b9a";  
            return "#4a148c"; 
        }

        function renderWeatherMatrix(data) {
            if (!data || data.length === 0) return;
            
            let latestDate = "-";
            for (let i = data.length - 1; i >= 0; i--) {
                if (data[i].Date) {
                    latestDate = data[i].Date;
                    break;
                }
            }
            
            document.getElementById('legend-date-title').innerText = `Annual Rainfall — Jan to ${latestDate}, 2026`;

            // Phase 1: Aggregate by Station using new CSV Columns
            const stationMap = {};

            data.forEach(row => {
                const name = row.Station_Name || row['Name of the station'];
                if (!name) return;

                // Fallback added to ensure backward compatibility during your transition
                const taluk = row.Taluk || row.Location_Details || "Unknown";
                const district = row.District || "Unknown";

                const uniqueID = name + "_" + taluk;

                if (!stationMap[uniqueID]) {
                    stationMap[uniqueID] = {
                        name: name,
                        lat: parseFloat(row.Latitude),
                        lon: parseFloat(row.Longitude),
                        taluk: taluk,
                        district: district,
                        annualTotal: 0.0,
                        winterTotal: 0.0,
                        summerTotal: 0.0,
                        swmTotal: 0.0,
                        todayVal: 0.0,
                        highestRain: 0.0,
                        highestDate: "-",
                        veryLightDays: 0,
                        lightDays: 0,
                        moderateDays: 0,
                        heavyDays: 0,
                        veryHeavyDays: 0,
                        extremeDays: 0
                    };
                }

                let mm = parseFloat(row.Rainfall_mm);
                if (isNaN(mm)) mm = 0.0;

                const st = stationMap[uniqueID];
                st.annualTotal += mm;

                if (mm > st.highestRain) {
                    st.highestRain = mm;
                    st.highestDate = row.Date;
                }

                if (mm > 0) {
                    if (mm <= 2.4) st.veryLightDays++;
                    else if (mm <= 15.5) st.lightDays++;
                    else if (mm <= 64.4) st.moderateDays++;
                    else if (mm <= 115.5) st.heavyDays++;
                    else if (mm <= 204.4) st.veryHeavyDays++;
                    else st.extremeDays++;
                }

                if (row.Date) {
                    const dateParts = row.Date.split('-');
                    if (dateParts.length === 3) {
                        const month = dateParts[1]; 
                        if (month === "01" || month === "02") st.winterTotal += mm;
                        else if (month === "03" || month === "04" || month === "05") st.summerTotal += mm;
                        else if (month === "06") st.swmTotal += mm;
                    }
                    if (row.Date === latestDate) st.todayVal = mm;
                }
            });

            // Phase 2: Build Taluk and District Aggregations based on dynamic columns
            const talukMap = {};
            const districtMap = {};

            Object.values(stationMap).forEach(st => {
                if (isNaN(st.lat) || isNaN(st.lon)) return;

                if (!talukMap[st.taluk]) {
                    talukMap[st.taluk] = { name: st.taluk, sub: "Taluk/Region", count: 0, latSum: 0, lonSum: 0, annual: 0, winter: 0, summer: 0, swm: 0, today: 0 };
                }
                let t = talukMap[st.taluk];
                t.count++; t.latSum += st.lat; t.lonSum += st.lon; t.annual += st.annualTotal; t.winter += st.winterTotal; t.summer += st.summerTotal; t.swm += st.swmTotal; t.today += st.todayVal;

                if (!districtMap[st.district]) {
                    districtMap[st.district] = { name: st.district, sub: "District Level Average", count: 0, latSum: 0, lonSum: 0, annual: 0, winter: 0, summer: 0, swm: 0, today: 0 };
                }
                let d = districtMap[st.district];
                d.count++; d.latSum += st.lat; d.lonSum += st.lon; d.annual += st.annualTotal; d.winter += st.winterTotal; d.summer += st.summerTotal; d.swm += st.swmTotal; d.today += st.todayVal;
            });

            // Phase 3: Function to draw circles
            function drawLayer(mapData, targetLayer, radiusSize, isAverage) {
                for (let key in mapData) {
                    const item = mapData[key];
                    if (isAverage && item.count === 0) continue;

                    const divider = isAverage ? item.count : 1;
                    const lat = isAverage ? item.latSum / divider : item.lat;
                    const lon = isAverage ? item.lonSum / divider : item.lon;
                    
                    const annual = isAverage ? item.annual / divider : item.annualTotal;
                    const winter = isAverage ? item.winter / divider : item.winterTotal;
                    const summer = isAverage ? item.summer / divider : item.summerTotal;
                    const swm = isAverage ? item.swm / divider : item.swmTotal;
                    const today = isAverage ? item.today / divider : item.todayVal;

                    const markerColor = getColor(annual);

                    const circle = L.circleMarker([lat, lon], {
                        radius: radiusSize,
                        fillColor: markerColor,
                        color: "white",
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.85
                    }).addTo(targetLayer);

                    const titlePrefix = isAverage ? `Average across ${item.count} stations` : "Total Accumulation";
                    
                    let advancedMetricsHTML = "";
                    
                    if (!isAverage) {
                        advancedMetricsHTML = `
                            <tr style="border-top: 2px solid #bdc3c7;">
                                <td colspan="2" style="padding-top:8px; padding-bottom:2px; font-size:11px; color:#7f8c8d; text-transform:uppercase;">🏆 Annual Extreme</td>
                            </tr>
                            <tr><td>Highest Single Day</td><td class="val" style="color:#c0392b;"><b>${item.highestRain.toFixed(1)} mm</b></td></tr>
                            <tr><td>Date of Extreme</td><td class="val">${item.highestDate}</td></tr>
                            
                            <tr>
                                <td colspan="2" style="padding-top:8px; padding-bottom:2px; font-size:11px; color:#7f8c8d; text-transform:uppercase;">📊 IMD Rain Days</td>
                            </tr>
                            <tr><td>V. Light <i>(< 2.5)</i></td><td class="val">${item.veryLightDays} days</td></tr>
                            <tr><td>Light <i>(2.5 - 15.5)</i></td><td class="val">${item.lightDays} days</td></tr>
                            <tr><td>Moderate <i>(15.6 - 64.4)</i></td><td class="val">${item.moderateDays} days</td></tr>
                            <tr><td>Heavy <i>(64.5 - 115.5)</i></td><td class="val">${item.heavyDays} days</td></tr>
                            <tr><td>V. Heavy <i>(115.6 - 204.4)</i></td><td class="val">${item.veryHeavyDays} days</td></tr>
                            <tr><td>Ext. Heavy <i>(> 204.4)</i></td><td class="val">${item.extremeDays} days</td></tr>
                        `;
                    }

                    // For single stations, display Taluk and District gracefully in the popup
                    const subtitle = isAverage ? item.sub : `${item.taluk}, ${item.district}`;

                    const popupContent = `
                        <div class="matrix-popup">
                            <div class="popup-header">${item.name}</div>
                            <div class="popup-sub">${subtitle}</div>
                            <table class="popup-table">
                                <tr><td>🌧️ Today (${latestDate})</td><td class="val"><b>${today.toFixed(1)} mm</b></td></tr>
                                <tr class="total-row"><td>Annual ${isAverage ? 'Average' : 'Total'}</td><td class="val">${annual.toFixed(1)} mm</td></tr>
                                <tr><td>❄️ Winter</td><td class="val">${winter.toFixed(1)} mm</td></tr>
                                <tr><td>☀️ Summer</td><td class="val">${summer.toFixed(1)} mm</td></tr>
                                <tr><td>☁️ SWM (so far)</td><td class="val">${swm.toFixed(1)} mm</td></tr>
                                ${advancedMetricsHTML}
                            </table>
                            <div class="popup-coords">${titlePrefix}</div>
                        </div>
                    `;
                    circle.bindPopup(popupContent, { maxWidth: 300 });
                    circle.bindTooltip(`<b>${item.name}</b><br>${isAverage ? 'Avg' : 'Total'}: ${annual.toFixed(1)} mm`, { sticky: true });
                }
            }

            drawLayer(stationMap, layers.station, 7, false); 
            drawLayer(talukMap, layers.taluk, 14, true);     
            drawLayer(districtMap, layers.district, 22, true); 
        }
    </script>
</body>
</html>
