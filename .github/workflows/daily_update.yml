name: Daily Rainfall Update

on:
  schedule:
    # Runs at 4:30 AM UTC, which equals 10:00 AM IST
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows you to trigger it manually anytime!

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas beautifulsoup4 pytz

      - name: Run Python Scraper
        run: python update_tracker.py

      - name: Commit and Push Updated CSV
        run: |
          git config --global user.name "GitHub Automation Bot"
          git config --global user.email "action@github.com"
          git add thanjavur_stations_rainfall_2026.csv
          # This line ensures it only commits if new data was actually added
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated daily rainfall update"
          git push
